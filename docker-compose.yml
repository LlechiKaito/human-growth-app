services:
  postgres:
    image: postgres:16-alpine
    container_name: hg-postgres
    environment:
      POSTGRES_DB: human_growth
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - hg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d human_growth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    container_name: hg-api
    environment:
      NODE_ENV: development
      API_PORT: 8080
      API_LOG_LEVEL: debug
      API_CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://dev:dev@postgres:5432/human_growth
      COGNITO_REGION: ap-northeast-1
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    container_name: hg-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_COGNITO_REGION: ap-northeast-1
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  hg-pgdata:
